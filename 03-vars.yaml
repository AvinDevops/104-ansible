- name: variables
  hosts: localhost
  vars: #define/declaring variables
    Course: "DevOps"
    Trainer: "Avinash"
    Duration: "120hrs"
  tasks: #list of tasks/collections/modules
  - name: printing variables
    ansible.builtin.debug:
      msg: "I am learning course: {{Course}} from trainer: {{Trainer}} and duration is {{Duration}}"